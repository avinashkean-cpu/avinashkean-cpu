name: Enterprise Architecture & Code Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-infrastructure-and-code:
    name: Lint & Validate Architecture, Terraform, FinOps, AIOps, MLOps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Validate Terraform Formatting
        run: |
          echo "Checking Terraform formatting across modules and environments..."
          terraform fmt -check -recursive terraform/ || exit 1
          terraform fmt -check -recursive mlops/terraform/ || exit 1
          echo "All Terraform files adhere to standard formatting."

      - name: PowerShell Script Syntax Verification
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path @('./scripts', './finops', './aiops') -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue
          foreach ($script in $scripts) {
            Write-Host "Verifying syntax for $($script.FullName)..."
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "Syntax errors found in $($script.Name)"
              exit 1
            }
          }
          Write-Host "All PowerShell scripts parsed cleanly!"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Python Scripts
        run: |
          python -m py_compile aiops/detectors/telemetry-incident-analyzer.py
          echo "All Python telemetry analyzers compiled cleanly without syntax issues!"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Python Scripts
        run: |
          python -m py_compile aiops/detectors/telemetry-incident-analyzer.py
          echo "All Python telemetry analyzers compiled cleanly without syntax issues!"

